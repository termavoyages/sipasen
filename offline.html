<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>SIPASEN — Hors ligne</title>
<style>
  :root{ --ink:#14110f; --foam:#f7f3ea; --signal:#ff3b1f; --teal:#00c2a8; }
  html,body{margin:0;min-height:100%;background:var(--foam);color:var(--ink);font-family:system-ui,sans-serif;}
  main{min-height:100dvh;display:grid;place-items:center;padding:32px 24px;}
  .card{max-width:28rem;}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:1.2rem;}
  .brand span{color:var(--signal);}
  h1{font-size:1.7rem;line-height:1.15;margin:18px 0 10px;}
  p{margin:0;color:rgba(20,17,15,.7);line-height:1.55;}
  a{display:inline-block;margin-top:22px;background:var(--signal);color:var(--ink);text-decoration:none;font-weight:700;padding:12px 18px;}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">SIPA<span>SEN</span></div>
    <h1>Pas de réseau pour le moment</h1>
    <p>L’application reste disponible. Rouvrez la page d’accueil mise en cache, ou réessayez dès que le signal revient.</p>
    <a href="./index.html">Revenir à SIPASEN</a>
  </div>
</main>
</body>
</html>
